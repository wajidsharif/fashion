<div>
    <h2 class="text-lg font-bold text-gray-900 mb-6">Recent Orders</h2>
    {% if orders %}
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="text-left text-gray-500 border-b border-gray-100">
                    <th class="pb-3 font-medium">Order</th>
                    <th class="pb-3 font-medium">Customer</th>
                    <th class="pb-3 font-medium">Amount</th>
                    <th class="pb-3 font-medium">Status</th>
                    <th class="pb-3 font-medium">Date</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders|slice:":10" %}
                <tr class="border-b border-gray-50">
                    <td class="py-3 font-medium text-gray-900">#{{ order.id }}</td>
                    <td class="py-3 text-gray-600">{{ order.full_name }}</td>
                    <td class="py-3 text-gray-900">Rs.{{ order.total_amount }}</td>
                    <td class="py-3">
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium
                            {% if order.status == 'pending' %}bg-yellow-100 text-yellow-800
                            {% elif order.status == 'confirmed' %}bg-blue-100 text-blue-800
                            {% elif order.status == 'processing' %}bg-indigo-100 text-indigo-800
                            {% elif order.status == 'shipped' %}bg-purple-100 text-purple-800
                            {% elif order.status == 'delivered' %}bg-green-100 text-green-800
                            {% elif order.status == 'cancelled' %}bg-red-100 text-red-800
                            {% endif %}">
                            {{ order.get_status_display }}
                        </span>
                    </td>
                    <td class="py-3 text-gray-500">{{ order.created_at|date:"M d, Y" }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p class="text-gray-500 text-center py-10">No orders yet.</p>
    {% endif %}
</div>
