{% extends 'base.html' %}
{% load static %}

{% block title %}Email Sent - Fashion Store{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Check your email</h1>
        <p class="text-gray-500 mb-8">We've sent a password reset link to your email address. Please check your inbox.</p>
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center px-8 py-3.5 bg-black text-white font-medium rounded-xl hover:bg-gray-800 transition">
            Back to Sign In
        </a>
    </div>
</div>
{% endblock %}
