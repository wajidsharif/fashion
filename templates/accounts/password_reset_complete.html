{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete - Fashion Store{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Password reset complete</h1>
        <p class="text-gray-500 mb-8">Your password has been successfully reset. You can now sign in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center px-8 py-3.5 bg-black text-white font-medium rounded-xl hover:bg-gray-800 transition">
            Sign In
        </a>
    </div>
</div>
{% endblock %}
