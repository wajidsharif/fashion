{% if messages %}
<div class="fixed top-20 right-4 z-50 space-y-2 max-w-sm" x-data>
    {% for message in messages %}
    <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)" x-show="show" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-x-full" x-transition:enter-end="opacity-100 translate-x-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-x-0" x-transition:leave-end="opacity-0 translate-x-full" class="flex items-center justify-between px-4 py-3 rounded-lg shadow-lg backdrop-blur-sm
        {% if message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200
        {% elif message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
        {% elif message.tags == 'warning' %}bg-yellow-50 text-yellow-800 border border-yellow-200
        {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
        <div class="flex items-center space-x-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                {% if message.tags == 'success' %}
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                {% elif message.tags == 'error' %}
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                {% elif message.tags == 'warning' %}
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                {% else %}
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                {% endif %}
            </svg>
            <p class="text-sm font-medium">{{ message }}</p>
        </div>
        <button @click="show = false" class="ml-3 flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
