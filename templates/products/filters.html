<form method="GET" action="{% url 'products:shop' %}" class="space-y-6">
    {% if search_query %}<input type="hidden" name="q" value="{{ search_query }}">{% endif %}

    <!-- Categories -->
    <div>
        <h4 class="font-medium text-sm text-gray-900 mb-3 uppercase tracking-wider">Category</h4>
        <div class="space-y-2">
            <a href="?{% if search_query %}q={{ search_query }}&{% endif %}" class="block text-sm {% if not selected_category %}text-black font-medium{% else %}text-gray-500 hover:text-black{% endif %} transition">All Categories</a>
            {% for cat in categories %}
            <a href="?category={{ cat.slug }}{% if search_query %}&q={{ search_query }}{% endif %}" class="block text-sm {% if selected_category == cat.slug %}text-black font-medium{% else %}text-gray-500 hover:text-black{% endif %} transition">{{ cat.name }}</a>
            {% endfor %}
        </div>
    </div>

    <!-- Price Range -->
    <div>
        <h4 class="font-medium text-sm text-gray-900 mb-3 uppercase tracking-wider">Price Range</h4>
        <div class="flex items-center space-x-2">
            <input type="number" name="min_price" placeholder="Min" value="{{ selected_min_price|default:'' }}" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-black focus:border-black outline-none">
            <span class="text-gray-400">-</span>
            <input type="number" name="max_price" placeholder="Max" value="{{ selected_max_price|default:'' }}" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-black focus:border-black outline-none">
        </div>
    </div>

    <!-- Sizes -->
    {% if sizes %}
    <div>
        <h4 class="font-medium text-sm text-gray-900 mb-3 uppercase tracking-wider">Size</h4>
        <div class="flex flex-wrap gap-2">
            <a href="?{% if search_query %}q={{ search_query }}&{% endif %}{% if selected_category %}category={{ selected_category }}&{% endif %}" class="px-3 py-1.5 text-xs border rounded-lg {% if not selected_size %}bg-black text-white border-black{% else %}border-gray-300 text-gray-600 hover:border-black{% endif %} transition">All</a>
            {% for size in sizes %}
            <a href="?size={{ size.code }}{% if search_query %}&q={{ search_query }}{% endif %}{% if selected_category %}&category={{ selected_category }}{% endif %}" class="px-3 py-1.5 text-xs border rounded-lg {% if selected_size == size.code %}bg-black text-white border-black{% else %}border-gray-300 text-gray-600 hover:border-black{% endif %} transition">{{ size.name }}</a>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <button type="submit" class="w-full py-3 bg-black text-white text-sm font-medium rounded-lg hover:bg-gray-800 transition">Apply Filters</button>
</form>
